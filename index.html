<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSMR Kano - Official Online Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .msmr-blue { background-color: #1e3a8a !important; }
        .msmr-text { color: #1e3a8a !important; }
        .page-section { display: none; }
        .active-section { display: block !important; }
    </style>
</head>
<body class="bg-slate-50 font-sans">

<header class="msmr-blue text-white py-10 shadow-xl text-center border-b-4 border-yellow-500">
    <h1 class="text-3xl font-black uppercase">Mu’assasatu Sheikh Muhammad Rabi’u</h1>
    <p class="text-[10px] font-bold opacity-80 mt-2 uppercase tracking-[4px]">Goran Dutse, Kano State</p>
</header>

<nav class="bg-white shadow-sm flex justify-center space-x-8 py-4 text-[11px] font-bold uppercase text-gray-500">
    <button onclick="show('home')">Home</button>
    <button onclick="show('reg')">Register</button>
    <button onclick="show('login')" class="msmr-text border-2 border-blue-900 px-4 py-1 rounded-full">Portal Login</button>
</nav>

<section id="home" class="page-section active-section p-10 text-center">
    <div class="max-w-xl mx-auto bg-white p-12 rounded-3xl shadow-xl">
        <h2 class="text-2xl font-black msmr-text mb-6 uppercase">Admission Portal</h2>
        <div class="flex flex-col gap-4">
            <button onclick="show('reg')" class="msmr-blue text-white py-4 rounded-xl font-bold uppercase shadow-lg">Start Application</button>
            <button onclick="show('login')" class="bg-slate-100 msmr-text py-4 rounded-xl font-bold uppercase">Print Interview Slip</button>
        </div>
    </div>
</section>

<section id="reg" class="page-section max-w-lg mx-auto my-10 p-8 bg-white rounded-3xl shadow-xl">
    <h2 class="text-xl font-black msmr-text mb-6 uppercase text-center border-b pb-2">Student Application</h2>
    <div class="space-y-4">
        <input id="fName" type="text" placeholder="First Name" class="w-full border-2 p-3 rounded-xl outline-none">
        <input id="lName" type="text" placeholder="Surname" class="w-full border-2 p-3 rounded-xl outline-none">
        <input id="phone" type="tel" placeholder="Phone Number" class="w-full border-2 p-3 rounded-xl outline-none">
        <select id="prog" class="w-full border-2 p-3 rounded-xl font-bold">
            <option value="One Year Hadda">One Year Hadda</option>
            <option value="Biye (Sat and Sun)">Biye (Sat and Sun)</option>
        </select>
        <button onclick="saveStudent()" class="w-full msmr-blue text-white p-4 rounded-xl font-black uppercase shadow-lg">Submit Registration</button>
    </div>
</section>

<section id="adminDash" class="page-section max-w-5xl mx-auto my-10 p-8 bg-white rounded-3xl shadow-xl">
    <div class="flex justify-between items-center border-b-2 pb-4 mb-6">
        <h2 class="text-2xl font-black msmr-text uppercase">Administrator Control</h2>
        <p id="count" class="text-blue-600 font-bold text-xs"></p>
    </div>
    <div id="list" class="space-y-3"></div>
</section>

<section id="login" class="page-section max-w-sm mx-auto my-20 p-8 bg-white rounded-3xl shadow-xl text-center">
    <input id="logVal" type="text" placeholder="Phone Number or 'admin'" class="w-full border-2 p-4 rounded-xl mb-4 text-center">
    <button onclick="doLogin()" class="w-full msmr-blue text-white p-4 rounded-xl font-black">LOGIN</button>
</section>

<script>
    let students = JSON.parse(localStorage.getItem('MSMR_DATABASE')) || [];

    function show(id) {
        document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active-section'));
        document.getElementById(id).classList.add('active-section');
    }

    function saveStudent() {
        const fn = document.getElementById('fName').value;
        const ph = document.getElementById('phone').value;
        if(!fn || !ph) return alert("Fill required fields");
        
        students.push({ 
            name: fn + " " + document.getElementById('lName').value, 
            ph: ph, 
            pr: document.getElementById('prog').value,
            date: 'TBA', time: 'TBA', venue: 'MSMR Office'
        });
        localStorage.setItem('MSMR_DATABASE', JSON.stringify(students));
        alert("Saved! You can now login to see your slip.");
        show('home');
    }

    function doLogin() {
        const v = document.getElementById('logVal').value;
        if(v === 'admin') {
            document.getElementById('count').innerText = "Total Students: " + students.length;
            const list = document.getElementById('list');
            list.innerHTML = students.map((s, i) => `
                <div class="p-4 border rounded-xl flex justify-between bg-gray-50">
                    <span><b>${s.name}</b> (${s.ph})</span>
                    <span class="text-xs uppercase font-bold text-blue-900">${s.pr}</span>
                </div>
            `).join('');
            show('adminDash');
        } else {
            const s = students.find(x => x.ph === v);
            if(s) alert("Welcome " + s.name + "! Your interview is " + s.date);
            else alert("Not found");
        }
    }
</script>
</body>
</html>
