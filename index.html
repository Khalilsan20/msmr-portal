<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSMR Kano - Official Cloud Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .msmr-blue { background-color: #1e3a8a !important; }
        .msmr-text { color: #1e3a8a !important; }
        .page-section { display: none; }
        .active-section { display: block !important; }
    </style>
</head>
<body class="bg-slate-50 font-sans">

<header class="msmr-blue text-white py-10 shadow-xl text-center border-b-4 border-yellow-500">
    <h1 class="text-3xl font-black uppercase">Mu’assasatu Sheikh Muhammad Rabi’u</h1>
    <p class="text-[10px] font-bold opacity-80 mt-2 uppercase tracking-[4px]">Goran Dutse, Kano State</p>
</header>

<nav class="bg-white shadow-sm flex justify-center space-x-8 py-4 text-[11px] font-bold uppercase text-gray-500">
    <button onclick="show('home')">Home</button>
    <button onclick="show('reg')">Register</button>
    <button onclick="show('login')" class="msmr-text border-2 border-blue-900 px-4 py-1 rounded-full font-black">Admin Login</button>
</nav>

<section id="home" class="page-section active-section p-10 text-center">
    <div class="max-w-xl mx-auto bg-white p-12 rounded-3xl shadow-xl border-t-8 border-blue-900">
        <h2 class="text-2xl font-black msmr-text mb-6 uppercase">Admission Portal</h2>
        <div class="flex flex-col gap-4">
            <button onclick="show('reg')" class="msmr-blue text-white py-4 rounded-xl font-bold uppercase shadow-lg">New Application</button>
            <button onclick="show('login')" class="bg-slate-100 msmr-text py-4 rounded-xl font-bold uppercase border-2 border-blue-900">Login to View Slip</button>
        </div>
    </div>
</section>

<section id="reg" class="page-section max-w-lg mx-auto my-10 p-8 bg-white rounded-3xl shadow-xl">
    <h2 class="text-xl font-black msmr-text mb-6 uppercase text-center border-b pb-2">Student Registration</h2>
    <div class="space-y-4">
        <input id="fName" type="text" placeholder="Full Name" class="w-full border-2 p-3 rounded-xl outline-none focus:border-blue-900">
        <input id="phone" type="tel" placeholder="Phone Number" class="w-full border-2 p-3 rounded-xl outline-none focus:border-blue-900">
        <select id="prog" class="w-full border-2 p-3 rounded-xl font-bold msmr-text">
            <option value="One Year Hadda">One Year Hadda</option>
            <option value="Biye (Sat and Sun)">Biye (Sat and Sun)</option>
        </select>
        <button onclick="saveToCloud()" id="btnSave" class="w-full msmr-blue text-white p-4 rounded-xl font-black uppercase shadow-lg">Submit & Save Online</button>
    </div>
</section>

<section id="adminDash" class="page-section max-w-6xl mx-auto my-10 p-10 bg-white rounded-3xl shadow-xl">
    <div class="flex justify-between items-center border-b-4 border-blue-900 pb-4 mb-8">
        <h2 class="text-2xl font-black msmr-text uppercase">Administrator Control</h2>
        <button onclick="location.reload()" class="bg-red-600 text-white px-4 py-1 rounded font-bold text-[10px] uppercase">Logout</button>
    </div>
    <div id="adminList" class="space-y-4">Loading cloud data...</div>
</section>

<section id="login" class="page-section max-w-sm mx-auto my-20 p-10 bg-white rounded-3xl shadow-2xl text-center border-t-8 border-blue-900">
    <h2 class="text-xl font-black msmr-text uppercase mb-6">Portal Sign-In</h2>
    <input id="logPh" type="text" placeholder="Phone or 'admin'" class="w-full border-2 p-4 rounded-2xl mb-4 text-center text-lg outline-none">
    <button onclick="handleLogin()" class="w-full msmr-blue text-white p-4 rounded-2xl font-black uppercase shadow-lg">Enter</button>
</section>

<script>
    // ✅ FIXED DATABASE LINK
    const FIREBASE_URL = "https://msmr-portal-default-rtdb.firebaseio.com/students.json";

    function show(id) {
        document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active-section'));
        document.getElementById(id).classList.add('active-section');
    }

    async function saveToCloud() {
        const name = document.getElementById('fName').value.trim();
        const ph = document.getElementById('phone').value.trim();
        const pr = document.getElementById('prog').value;

        if(!name || !ph) return alert("Error: Name and Phone required!");

        const btn = document.getElementById('btnSave');
        btn.innerText = "SAVING ONLINE...";
        btn.disabled = true;

        const studentData = { name, ph, pr, date: 'TBA', time: 'TBA', venue: 'MSMR Office' };

        try {
            await fetch(FIREBASE_URL, {
                method: 'POST',
                body: JSON.stringify(studentData)
            });
            alert("Success! " + name + " is now registered in the cloud database.");
            location.reload();
        } catch (e) {
            alert("Cloud error: Please check your Firebase Rules.");
            btn.disabled = false;
            btn.innerText = "SUBMIT & SAVE ONLINE";
        }
    }

    async function handleLogin() {
        const val = document.getElementById('logPh').value.trim();
        
        if(val === 'admin') {
            show('adminDash');
            loadAdminData();
        } else {
            const res = await fetch(FIREBASE_URL);
            const data = await res.json();
            const found = Object.values(data || {}).find(s => s.ph === val);
            if(found) alert("Found! Interview Date: " + found.date);
            else alert("Phone number not found in cloud.");
        }
    }

    async function loadAdminData() {
        const res = await fetch(FIREBASE_URL);
        const data = await res.json();
        const list = document.getElementById('adminList');
        
        if(!data) {
            list.innerHTML = "No students registered yet.";
            return;
        }

        list.innerHTML = Object.entries(data).map(([key, s]) => `
            <div class="p-5 border-2 rounded-2xl bg-gray-50 flex flex-wrap items-center justify-between">
                <div>
                    <p class="font-black msmr-text uppercase">${s.name}</p>
                    <p class="text-xs text-gray-400 font-bold">${s.ph} | ${s.pr}</p>
                </div>
                <div class="text-[10px] font-black text-green-600 bg-green-100 px-3 py-1 rounded-full uppercase">Cloud Verified</div>
            </div>
        `).join('');
    }
</script>
</body>
</html>
